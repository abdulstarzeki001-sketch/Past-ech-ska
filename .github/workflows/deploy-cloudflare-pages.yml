name: Deploy Past-ech-ska to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: past-ech-ska-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare token and Pages project access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'd2680f7c5ff39f8d9177a51dbf7fec75' }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN?.trim();
          const account = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          if (!token) {
            console.error("::error::Missing CLOUDFLARE_PAGES_TOKEN GitHub Actions secret.");
            process.exit(1);
          }
          if (!account || !/^[a-f0-9]{32}$/.test(account)) {
            console.error("::error::Invalid CLOUDFLARE_ACCOUNT_ID. Set it to the account owning past-ech-ska.");
            process.exit(1);
          }
          async function getApi(path) {
            try {
              const response = await fetch("https://api.cloudflare.com/client/v4" + path, {
                headers: { Authorization: "Bearer " + token },
                signal: AbortSignal.timeout(15000),
              });
              const body = await response.json().catch(() => null);
              return { status: response.status, body };
            } catch {
              console.error("::error::Could not reach Cloudflare API; check connectivity or retry.");
              process.exit(1);
            }
          }
          // Never print secret values or API token IDs to CI logs.
          const verify = await getApi("/user/tokens/verify");
          if (!verify.body?.success || verify.body?.result?.status !== "active") {
            console.error("::error::Cloudflare API Token is invalid, expired or inactive (HTTP " + verify.status + "). Replace the CLOUDFLARE_PAGES_TOKEN GitHub secret with a newly generated API Token, not a Global API Key.");
            process.exit(1);
          }
          const project = await getApi("/accounts/" + account + "/pages/projects/past-ech-ska");
          if (!project.body?.success) {
            const codes = (project.body?.errors || []).map((e) => e.code).filter(Boolean).join(",") || "unknown";
            console.error("::error::Cloudflare token is active but cannot access Pages project past-ech-ska in account " + account + " (HTTP " + project.status + ", API code " + codes + "). Grant Account > Cloudflare Pages > Edit; set Account Resources to Include the account that owns past-ech-ska. If this account ID is wrong, update CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets.");
            process.exit(1);
          }
          console.log("Cloudflare API Token active. Pages project and account access confirmed.");
          NODE

      - name: Build website and Telegram app
        run: pnpm run build:cloudflare

      - name: Publish production build to past-ech-ska
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'd2680f7c5ff39f8d9177a51dbf7fec75' }}
        run: |
          # GitHub secret values can accidentally include a trailing newline.
          # Wrangler rejects such account IDs even though the Cloudflare API
          # accepts the trimmed value in the earlier verification step.
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Invalid CLOUDFLARE_ACCOUNT_ID. Check that the GitHub secret contains only the 32-character Cloudflare account ID, with no extra characters."
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 pages deploy artifacts/nafsam/dist/public \
            --project-name=past-ech-ska \
            --branch=main \
            --commit-hash="$GITHUB_SHA"
