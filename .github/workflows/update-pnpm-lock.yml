name: Update pnpm lockfile for main
on:
  push:
    branches: [main]
    paths:
      - artifacts/nafsam/package.json
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pnpm-lock-main
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile without installing packages
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit synchronized lockfile to main
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(deps): sync pnpm lockfile for cinematic frontend"
            git push origin HEAD:main
          fi
